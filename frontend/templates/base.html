<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Energy Consumption Optimizer{% endblock %}</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- Chart.js & Plotly.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <a href="/" class="sidebar-brand">
        <i class="fa-solid fa-bolt-lightning"></i>
        <span>Energy Optimizer</span>
      </a>
    </div>

    <ul class="nav-links">
      <li class="nav-item">
        <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
          <i class="fa-solid fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/forecast" class="nav-link {% if active_page == 'forecast' %}active{% endif %}">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Prophet Forecast</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/anomalies" class="nav-link {% if active_page == 'anomalies' %}active{% endif %}">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Anomalies</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/peaks" class="nav-link {% if active_page == 'peaks' %}active{% endif %}">
          <i class="fa-solid fa-fire"></i>
          <span>Peak Load & Shifting</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/recommendations" class="nav-link {% if active_page == 'recommendations' %}active{% endif %}">
          <i class="fa-solid fa-lightbulb"></i>
          <span>Recommendations</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/savings" class="nav-link {% if active_page == 'savings' %}active{% endif %}">
          <i class="fa-solid fa-calculator"></i>
          <span>Cost & Savings</span>
        </a>
      </li>
    </ul>

    <div class="p-3 border-top border-secondary-subtle text-muted text-center" style="font-size: 0.75rem;">
      Smart Energy Optimizer v2.0<br>
      <span class="text-cyan"><i class="fa-solid fa-brain"></i> FastAPI & FB Prophet</span>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
