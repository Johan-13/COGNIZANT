<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}Energy Optimizer - Management Console{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts: Material Symbols Outlined & Sora -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <!-- Tailwind Configuration matching Stitch Design System -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-surface-variant": "#c0c9b9",
            "surface-tint": "#8cd97c",
            "on-secondary-container": "#aabea0",
            "on-tertiary-container": "#2c4a91",
            "secondary-container": "#3c4e36",
            "error": "#ffb4ab",
            "on-tertiary-fixed": "#001848",
            "secondary-fixed-dim": "#b8cdae",
            "secondary": "#b8cdae",
            "on-background": "#cde5ff",
            "on-secondary-fixed": "#0f1f0b",
            "surface-container": "#002238",
            "outline-variant": "#40493d",
            "on-primary-fixed-variant": "#005305",
            "on-error": "#690005",
            "outline": "#8a9484",
            "on-primary-fixed": "#002201",
            "inverse-surface": "#cde5ff",
            "error-container": "#93000a",
            "on-secondary": "#24351f",
            "on-error-container": "#ffdad6",
            "primary-fixed-dim": "#8cd97c",
            "primary-fixed": "#a7f695",
            "surface": "#001525",
            "surface-container-low": "#001d32",
            "surface-container-high": "#0b2c44",
            "surface-variant": "#193750",
            "background": "#001525",
            "inverse-on-surface": "#13334b",
            "primary-container": "#84d175",
            "surface-container-highest": "#193750",
            "tertiary-container": "#a7bdff",
            "inverse-primary": "#226c1e",
            "surface-container-lowest": "#000f1d",
            "on-primary": "#003a02",
            "tertiary-fixed-dim": "#b2c5ff",
            "on-primary-container": "#0a5a0b",
            "primary": "#9fee8e",
            "tertiary-fixed": "#dae2ff",
            "on-tertiary": "#012b72",
            "surface-dim": "#001525",
            "on-tertiary-fixed-variant": "#24438a",
            "surface-bright": "#1e3c54",
            "on-secondary-fixed-variant": "#3a4b34",
            "secondary-fixed": "#d4e9c8",
            "tertiary": "#cfdaff",
            "on-surface": "#cde5ff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1.25rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-mobile": "16px",
            "sm": "16px",
            "xs": "8px",
            "md": "24px",
            "lg": "32px",
            "base": "4px",
            "xl": "48px",
            "gutter": "20px",
            "margin-desktop": "32px"
          },
          "fontFamily": {
            "sans": ["Sora", "sans-serif"],
            "headline-lg": ["Sora"],
            "body-lg": ["Sora"],
            "headline-lg-mobile": ["Sora"],
            "display-md": ["Sora"],
            "label-sm": ["Sora"],
            "display-lg": ["Sora"],
            "body-md": ["Sora"],
            "label-md": ["Sora"]
          },
          "fontSize": {
            "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "display-md": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }]
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Sora', sans-serif;
    }
    .glass-card {
      background-color: rgba(12, 45, 69, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 21, 37, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(159, 238, 142, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(159, 238, 142, 0.4);
    }
  </style>
</head>
<body class="bg-[#041f17] text-[#FFF8D2] font-body-md antialiased min-h-screen relative flex flex-col">
  <!-- Background Image with Forest Green Fallback & Overlay -->
  <div class="fixed inset-0 z-0 bg-cover bg-center" style="background: radial-gradient(circle at 50% 15%, #1e5845 0%, #0e3b2c 35%, #05231a 75%, #02140f 100%), url('/static/bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-blend-mode: overlay;"></div>
  <div class="grain-overlay"></div>

  <!-- Top Navigation & Branding (from Stitch Design) -->
  <header class="w-full bg-surface-container-low/80 dark:bg-surface-container-low/80 backdrop-blur-[20px] border-b border-white/10 shadow-xl z-20 relative pt-4 px-6 flex flex-col gap-4">
    <div class="flex justify-between items-center w-full">
      <!-- Left Spacer -->
      <div class="w-1/3 flex items-center">
        <div id="live-indicator" class="hidden items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/30 text-primary text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
          <span>LIVE STREAM ACTIVE</span>
        </div>
      </div>
      
      <!-- Center Branding -->
      <div class="w-1/3 flex flex-col items-center justify-center text-center">
        <a href="/" class="text-headline-lg font-headline-lg text-primary flex items-center justify-center gap-2 mb-1 hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">eco</span>
          <span>Energy Optimizer</span>
        </a>
        <div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Management Console</div>
      </div>
      
      <!-- Right Icons -->
      <div class="w-1/3 flex items-center justify-end gap-4">
        <button id="btn-global-refresh" title="Refresh Live Telemetry" class="material-symbols-outlined text-[#FFF8D2] cursor-pointer hover:text-primary transition-colors p-1.5 rounded-full hover:bg-white/5">
          sync
        </button>
        <span class="material-symbols-outlined text-[#FFF8D2] cursor-pointer hover:text-primary transition-colors p-1.5 rounded-full hover:bg-white/5">notifications</span>
        <span class="material-symbols-outlined text-[#FFF8D2] cursor-pointer hover:text-primary transition-colors p-1.5 rounded-full hover:bg-white/5">settings</span>
        <span class="material-symbols-outlined text-[#FFF8D2] cursor-pointer hover:text-primary transition-colors p-1.5 rounded-full hover:bg-white/5">account_circle</span>
      </div>
    </div>

    <!-- Main Navigation Tabs -->
    <nav class="flex justify-center gap-2 overflow-x-auto pb-0 mt-2">
      <a class="flex items-center gap-2 px-6 py-3 {% if active_page == 'dashboard' %}text-primary bg-primary/10 border-b-2 border-primary font-bold{% else %}text-on-surface-variant opacity-60 hover:bg-primary/5 hover:opacity-100 transition-all duration-300 border-b-2 border-transparent{% endif %}" href="/dashboard">
        <span class="material-symbols-outlined text-sm">dashboard</span>
        <span class="font-label-md text-label-md">Dashboard</span>
      </a>
      <a class="flex items-center gap-2 px-6 py-3 {% if active_page == 'anomalies' %}text-primary bg-primary/10 border-b-2 border-primary font-bold{% else %}text-on-surface-variant opacity-60 hover:bg-primary/5 hover:opacity-100 transition-all duration-300 border-b-2 border-transparent{% endif %}" href="/anomalies">
        <span class="material-symbols-outlined text-sm">warning</span>
        <span class="font-label-md text-label-md">Anomalies</span>
      </a>
      <a class="flex items-center gap-2 px-6 py-3 {% if active_page == 'peaks' %}text-primary bg-primary/10 border-b-2 border-primary font-bold{% else %}text-on-surface-variant opacity-60 hover:bg-primary/5 hover:opacity-100 transition-all duration-300 border-b-2 border-transparent{% endif %}" href="/peaks">
        <span class="material-symbols-outlined text-sm">ev_station</span>
        <span class="font-label-md text-label-md">Peak Load &amp; Shifting</span>
      </a>
      <a class="flex items-center gap-2 px-6 py-3 {% if active_page == 'recommendations' %}text-primary bg-primary/10 border-b-2 border-primary font-bold{% else %}text-on-surface-variant opacity-60 hover:bg-primary/5 hover:opacity-100 transition-all duration-300 border-b-2 border-transparent{% endif %}" href="/recommendations">
        <span class="material-symbols-outlined text-sm">lightbulb</span>
        <span class="font-label-md text-label-md">Recommendations</span>
      </a>
      <a class="flex items-center gap-2 px-6 py-3 {% if active_page == 'savings' %}text-primary bg-primary/10 border-b-2 border-primary font-bold{% else %}text-on-surface-variant opacity-60 hover:bg-primary/5 hover:opacity-100 transition-all duration-300 border-b-2 border-transparent{% endif %}" href="/savings">
        <span class="material-symbols-outlined text-sm">payments</span>
        <span class="font-label-md text-label-md">Cost &amp; Savings</span>
      </a>
    </nav>
  </header>

  <!-- Main Content Canvas -->
  <div class="flex flex-1 relative z-10 w-full max-w-[1600px] mx-auto">
    <main class="flex-1 p-margin-desktop overflow-y-auto w-full">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
